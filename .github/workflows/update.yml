name: Update carry data
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          OPENDOTA_KEY: ${{ secrets.OPENDOTA_KEY }}
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: python -u fetch_data.py
      - name: Commit
        run: |
          git config user.name "carry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json cache.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
