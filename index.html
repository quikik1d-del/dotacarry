<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Керри Dota 2 — хай ПТС</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--tx:#1b1b1f;--mu:#6b6b75;--ac:#c0392b;--bd:#e3dfd8;--ok:#1e8e4e;--no:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1b1d22;--tx:#ecebe8;--mu:#9a9aa5;--ac:#ff6b57;--bd:#2c2f36;--ok:#4cc38a;--no:#ff7a6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:900px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.92rem}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input,select{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
input{flex:1;min-width:150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0;cursor:pointer;overflow:hidden;text-align:left;color:var(--tx);font:inherit}
.tile:hover{border-color:var(--ac)}
.tile img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bd)}
.tile div{padding:6px 8px}
.tile b{display:block;font-size:.95rem}
.tile small{color:var(--mu)}
dialog{width:min(720px,94vw);max-height:90vh;border:1px solid var(--bd);border-radius:14px;padding:0;background:var(--bg);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.head{display:flex;gap:12px;align-items:center;padding:12px 14px;position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd)}
.head img{width:96px;border-radius:8px}
.head h2{margin:0;font-size:1.2rem}
.x{margin-left:auto;font-size:1.4rem;border:0;background:none;color:var(--tx);cursor:pointer}
.in{padding:0 14px 16px}
h3{font-size:.95rem;margin:14px 0 6px;color:var(--ac)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.k{background:var(--card);border-radius:10px;padding:8px 10px}
.k b{display:block;font-size:1.05rem}
.k span{color:var(--mu);font-size:.8rem}
details.g{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
details.g summary{cursor:pointer;padding:8px 10px;display:flex;gap:10px;flex-wrap:wrap;list-style:none}
details.g summary::-webkit-details-marker{display:none}
.w{color:var(--ok);font-weight:700}.l{color:var(--no);font-weight:700}
.mu{color:var(--mu);font-size:.85rem}
.g .in{padding:0 10px 10px}
a{color:var(--ac)}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.it{text-align:center}.it img{width:44px;height:32px;border-radius:4px;display:block;background:var(--bd)}
.it i{font-style:normal;font-size:.75rem;color:var(--mu)}
.im{width:36px;height:26px;border-radius:4px;vertical-align:middle;margin-right:6px;background:var(--bd)}
.hm{width:256px;max-width:100%;border-radius:8px;border:1px solid var(--bd);display:block;margin-top:8px}
.msg{padding:24px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>Керри — хай ПТС (7000+)</h1>
<p class="sub" id="meta">Загрузка…</p>
<div class="bar">
<input id="q" placeholder="Найти героя">
<select id="s"><option value="games">По числу побед</option><option value="wr">По винрейту</option></select>
</div>
<div id="app" class="tiles"></div>
</main>
<dialog id="dlg"></dialog>
<script>
var PH="all",CUR=null,D=null,CDN="https://cdn.cloudflare.steamstatic.com",dlg=document.getElementById("dlg");
function mm(x){if(x==null)return"—";var m=Math.floor(x),s=Math.round((x-m)*60);return m+":"+(s<10?"0":"")+s}
function v(x){return x==null?"—":x}
function ago(t){var h=(Date.now()/1000-t)/3600;return h<1?Math.round(h*60)+" мин назад":Math.round(h)+" ч назад"}
function list(){
var app=document.getElementById("app");
if(!D||!D.heroes.length){app.innerHTML='<div class="msg" style="grid-column:1/-1">Пока мало данных: нужны разобранные матчи. Загляни после следующего обновления.</div>';return}
var q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("s").value;
var hs=D.heroes.map(function(h,i){h.i=i;return h}).filter(function(h){return h.hero.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b[s]-a[s]});
app.innerHTML=hs.map(function(h){
return'<button class="tile" data-i="'+h.i+'"><img loading="lazy" src="'+CDN+h.img+'" alt="" onerror="this.style.visibility=\'hidden\'"><div><b>'+h.hero+'</b><small>'+h.games+' побед · WR '+h.wr+'%</small></div></button>'}).join("");
}
function draw(c,cells){
cells=(cells||[]).filter(function(p){return PH=="all"||(p[3]==null?0:p[3])==+PH});
var x=c.getContext("2d");x.fillStyle="#1c2a22";x.fillRect(0,0,256,256);
x.strokeStyle="#3b6ea5";x.lineWidth=10;x.globalAlpha=.55;x.beginPath();x.moveTo(0,0);x.lineTo(256,256);x.stroke();x.globalAlpha=1;
x.fillStyle="#9fb7a8";x.font="11px sans-serif";x.fillText("Схема: лайн внизу справа",6,248);
if(!cells||!cells.length){x.fillText("нет данных за этот период",50,120);return}
var mx=0;cells.forEach(function(p){if(p[2]>mx)mx=p[2]});
cells.forEach(function(p){var a=Math.min(1,.25+p[2]/mx);x.fillStyle="rgba(255,90,40,"+a+")";x.fillRect((p[0]-64)*2-1,(192-p[1])*2-1,4,4)});
}
function redraw(){dlg.querySelectorAll("canvas.hm").forEach(function(c){var gi=+c.dataset.gi;draw(c,gi<0?CUR.heat:CUR.list[gi].pos)})}
function open(i){
var h=D.heroes[i],f=h.farm;CUR=h;
var builds=h.builds.map(function(b){return"<tr><td>"+b.items.map(function(n,j){return'<img class="im" loading="lazy" src="'+CDN+(b.imgs?b.imgs[j]:"")+'" title="'+n+'" alt="'+n+'">'}).join("→")+"</td><td>"+b.games+"</td></tr>"}).join("")||'<tr><td colspan="2" class="mu">Пока мало данных</td></tr>';
var items=h.items.map(function(x){return'<tr><td><img class="im" loading="lazy" src="'+CDN+(x.img||"")+'" alt="" onerror="this.style.visibility=\'hidden\'">'+x.name+"</td><td>"+mm(x.time)+"</td><td>"+x.share+"%</td></tr>"}).join("")||'<tr><td colspan="3" class="mu">Пока мало данных</td></tr>';
function ic(p,extra){return'<span class="it"><img loading="lazy" src="'+CDN+p[2]+'" alt="" title="'+p[0]+(extra?" — "+extra:"")+'" onerror="this.style.visibility=\'hidden\'"><i>'+Math.round(p[1])+'m</i></span>'}
var games=(h.list||[]).map(function(g,gi){
var its=g.items.map(function(p){return ic(p)}).join("");
var nex=[];
var nt=(g.neut||[]).map(function(p){var ex=Object.keys(p[3]||{}).map(function(k){return k+": "+p[3][k]}).join(", ");if(ex)nex.push(p[0]+" ("+ex+")");return ic(p,ex)}).join("");
return'<details class="g"><summary><span class="'+(g.win?"w":"l")+'">'+(g.win?"Победа":"Поражение")+'</span><span>'+g.dur+' мин</span><span>'+v(g.kda[0])+'/'+v(g.kda[1])+'/'+v(g.kda[2])+'</span><span>GPM '+v(g.gpm)+'</span><span class="mu">'+ago(g.t)+'</span></summary><div class="in">'+
'<div class="mu">Добития на 10 / 20 / 30 мин: '+v(g.lh[0])+' / '+v(g.lh[1])+' / '+v(g.lh[2])+'</div>'+
'<div class="strip">'+its+'</div>'+(nt?'<div class="mu">Нейтральные предметы</div><div class="strip">'+nt+'</div>':'')+(nex.length?'<div class="mu">Зачарования: '+nex.join("; ")+'</div>':'')+'<div class="mu">Перемещение по карте</div><canvas class="hm" width="256" height="256" data-gi="'+gi+'"></canvas>'+
(g.id?'<div class="mu" style="margin-top:6px">Матч '+g.id+' · <a href="https://www.opendota.com/matches/'+g.id+'" target="_blank" rel="noopener">в OpenDota</a></div>':'')+
'</div></details>'}).join("")||'<div class="mu">Список игр появится после следующего обновления.</div>';
dlg.innerHTML='<div class="head"><img src="'+CDN+h.img+'" alt="" onerror="this.style.display=\'none\'"><div><h2>'+h.hero+'</h2><div class="mu">'+h.games+' побед из '+h.total+' игр · WR '+h.wr+'%</div></div><button class="x" aria-label="Закрыть">×</button></div><div class="in">'+
'<h3>Фарм</h3><div class="grid">'+
'<div class="k"><b>'+v(f.lh[0])+' / '+v(f.lh[1])+' / '+v(f.lh[2])+'</b><span>добитий на 10 / 20 / 30 мин</span></div>'+
'<div class="k"><b>'+v(f.nw[0])+' / '+v(f.nw[1])+' / '+v(f.nw[2])+'</b><span>золото на 10 / 20 / 30 мин</span></div>'+
'<div class="k"><b>'+v(f.gpm)+' / '+v(f.xpm)+'</b><span>GPM / XPM</span></div>'+
'<div class="k"><b>'+v(f.neutral)+'</b><span>убито нейтралов</span></div>'+
'<div class="k"><b>'+v(f.lane)+'%</b><span>эффективность лайна</span></div></div>'+
'<h3>Частые сборки (первые 4 предмета)</h3><div class="sc"><table><tr><th>Порядок</th><th>Игр</th></tr>'+builds+'</table></div>'+
'<h3>Тайминги предметов (медиана)</h3><div class="sc"><table><tr><th>Предмет</th><th>Время</th><th>Покупают</th></tr>'+items+'</table></div>'+
'<h3>Нейтральные предметы</h3><div class="strip">'+((h.neutrals||[]).map(function(n){return'<span class="it"><img loading="lazy" src="'+CDN+n.img+'" alt="" title="'+n.name+'" onerror="this.style.visibility=\'hidden\'"><i>'+n.share+'%</i></span>'}).join("")||'<span class="mu">нет данных</span>')+'</div>'+
'<h3>Где перемещается по карте (все игры)</h3><select id="ph"><option value="all">Вся игра</option><option value="0">0–10 мин</option><option value="1">10–20 мин</option><option value="2">20–30 мин</option><option value="3">30+ мин</option></select><canvas class="hm" width="256" height="256" data-gi="-1"></canvas>'+
'<h3>Победные игры за последние 24 часа</h3>'+games+'</div>';
dlg.querySelector("#ph").value=PH;redraw();
dlg.showModal();dlg.scrollTop=0;
}
document.getElementById("app").onclick=function(e){var t=e.target.closest(".tile");if(t)open(+t.dataset.i)};
dlg.onchange=function(e){if(e.target.id=="ph"){PH=e.target.value;redraw()}};
dlg.onclick=function(e){if(e.target===dlg||e.target.closest(".x"))dlg.close()};
fetch("data.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){
D=d;var m=Math.round((Date.now()/1000-d.updated)/60);
document.getElementById("meta").textContent="Патч "+d.patch+" · игр керри за 24 ч: "+d.total+" · обновлено "+(m<90?m+" мин назад":Math.round(m/60)+" ч назад");
list();
}).catch(function(){document.getElementById("meta").textContent="Данные ещё не загружены";document.getElementById("app").innerHTML='<div class="msg" style="grid-column:1/-1">Файл data.json не найден. Запусти обновление в GitHub Actions.</div>'});
document.getElementById("q").oninput=list;document.getElementById("s").onchange=list;
</script>
</body>
</html>
