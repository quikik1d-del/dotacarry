<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Керри Dota 2 — хай ПТС, сборки и фарм</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--tx:#1b1b1f;--mu:#6b6b75;--ac:#c0392b;--bd:#e3dfd8;--bar:#e8e4dc}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1b1d22;--tx:#ecebe8;--mu:#9a9aa5;--ac:#ff6b57;--bd:#2c2f36;--bar:#2a2d34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:820px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.92rem}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input,select{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
input{flex:1;min-width:150px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
.mu{color:var(--mu);font-weight:400;font-size:.88rem}
.in{padding:0 14px 14px}
h3{font-size:.95rem;margin:14px 0 6px;color:var(--ac)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k{background:var(--bg);border-radius:10px;padding:8px 10px}
.k b{display:block;font-size:1.1rem}
.k span{color:var(--mu);font-size:.8rem}
.msg{padding:24px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>Керри — хай ПТС (7000+)</h1>
<p class="sub" id="meta">Загрузка…</p>
<div class="bar">
<input id="q" placeholder="Найти героя">
<select id="s"><option value="games">По числу игр</option><option value="wr">По винрейту</option></select>
</div>
<div id="app"></div>
</main>
<script>
var D=null;
function mm(x){if(x==null)return"—";var m=Math.floor(x),s=Math.round((x-m)*60);return m+":"+(s<10?"0":"")+s}
function v(x){return x==null?"—":x}
function render(){
var app=document.getElementById("app");
if(!D||!D.heroes.length){app.innerHTML='<div class="msg">Пока мало данных: нужны разобранные матчи. Загляни после следующего обновления.</div>';return}
var q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("s").value;
var hs=D.heroes.filter(function(h){return h.hero.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b[s]-a[s]});
app.innerHTML=hs.map(function(h){
var f=h.farm;
var builds=h.builds.map(function(b){return"<tr><td>"+b.items.join(" → ")+"</td><td>"+b.games+"</td><td>"+b.wr+"%</td></tr>"}).join("");
var items=h.items.map(function(i){return"<tr><td>"+i.name+"</td><td>"+mm(i.time)+"</td><td>"+i.share+"%</td><td>"+i.wr+"%</td></tr>"}).join("");
return'<details><summary><span>'+h.hero+'</span><span class="mu">'+h.games+' игр · '+h.wr+'% побед</span></summary><div class="in">'+
'<h3>Фарм</h3><div class="grid">'+
'<div class="k"><b>'+v(f.lh[0])+' / '+v(f.lh[1])+' / '+v(f.lh[2])+'</b><span>добитий на 10 / 20 / 30 мин</span></div>'+
'<div class="k"><b>'+v(f.nw[0])+' / '+v(f.nw[1])+' / '+v(f.nw[2])+'</b><span>золото на 10 / 20 / 30 мин</span></div>'+
'<div class="k"><b>'+v(f.gpm)+' / '+v(f.xpm)+'</b><span>GPM / XPM</span></div>'+
'<div class="k"><b>'+v(f.neutral)+'</b><span>убито нейтралов</span></div>'+
'<div class="k"><b>'+v(f.lane)+'%</b><span>эффективность лайна</span></div></div>'+
'<h3>Частые сборки (первые 4 предмета)</h3><div class="scroll"><table><tr><th>Порядок</th><th>Игр</th><th>Винрейт</th></tr>'+builds+'</table></div>'+
'<h3>Тайминги предметов (медиана)</h3><div class="scroll"><table><tr><th>Предмет</th><th>Время</th><th>Покупают</th><th>Винрейт</th></tr>'+items+'</table></div>'+
'</div></details>'}).join("");
}
fetch("data.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){
D=d;
var ago=Math.round((Date.now()/1000-d.updated)/60);
document.getElementById("meta").textContent="Патч "+d.patch+" · игр керри за 24 ч: "+d.total+" · обновлено "+(ago<90?ago+" мин назад":Math.round(ago/60)+" ч назад");
render();
}).catch(function(){document.getElementById("meta").textContent="Данные ещё не загружены";document.getElementById("app").innerHTML='<div class="msg">Файл data.json не найден. Запусти обновление в GitHub Actions.</div>'});
document.getElementById("q").oninput=render;document.getElementById("s").onchange=render;
</script>
</body>
</html>
